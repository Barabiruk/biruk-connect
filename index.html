<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Barabiruk Connect — Professional Hub">
  <meta name="theme-color" content="#f7f8f5">
  <title>Barabiruk Connect | Professional Hub</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root{--ink:#17231f;--muted:#64736c;--paper:#f7f8f5;--green:#c9f36b;--deep:#163d32;--line:#dfe5dc;--white:#fff;--gold:#e6b85c;}
    
    *{box-sizing:border-box; margin:0; padding:0;}
    
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
      line-height: 1.65;
    }

    #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;}

    a{color:inherit;text-decoration:none}
    
    .container{
      width: 100%;
      max-width: 1160px;
      padding-left: 16px;
      padding-right: 16px;
      margin-inline: auto;
    }
    
    .site-header{position:sticky;top:0;z-index:1000;background:rgba(247,248,245,.98);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(223,229,220,.8)}
    .nav{height:75px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative}
    
    .brand-group {display:flex; align-items:center; gap:8px;}
    .header-mini-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
    }

    .brand{display:inline-flex;align-items:center;gap:6px;font-family:Manrope,sans-serif;font-size:16px;font-weight:800;letter-spacing:-.7px;white-space:nowrap}
    .brand-mark{display:grid;place-items:center;width:28px;height:28px;background:var(--green);border-radius:8px;font-size:14px}
    .brand-accent{color:#53836a;margin-left:2px}
    
    .nav-right{display:flex;align-items:center;gap:8px;}
    
    .nav-links{display:flex;gap:15px;align-items:center}
    .nav-links a{font-size:12px;color:#53625a;font-weight:700;transition:color .2s;white-space:nowrap;}
    .nav-links a:hover{color:#578c3e}
    
    .language-picker select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;color:var(--ink);font:600 11px 'DM Sans',sans-serif;cursor:pointer;outline:none}
    .menu-toggle{display:none;background:none;border:0;font-size:24px;color:var(--ink);cursor:pointer;padding:4px}

    .hero{position:relative;overflow:hidden;background:rgba(237,241,233,0.7);padding:50px 0}
    .hero-grid{position:relative;z-index:1;display:block;text-align:center;max-width:700px;margin:0 auto;}
    .eyebrow,.section-kicker{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#65816b}
    .eyebrow{display:inline-flex;align-items:center;gap:8px}
    .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:#79aa4a;display:inline-block}
    .hero h1,.section-title,.contact-inner h2{font-family:Manrope,sans-serif;font-size:clamp(32px,6vw,60px);line-height:1.12;letter-spacing:-1.5px;margin:16px 0 16px;font-weight:800}
    .hero h1 span{color:#62834d}
    .hero-text{color:#637168;font-size:16px;line-height:1.7;margin:0 auto;}
    .hero-actions{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:24px;flex-wrap:wrap}
    
    .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:700;transition:transform .2s,background .2s;cursor:pointer;border:none;}
    .button-primary{background:var(--deep);color:#fff}
    .button-quiet{border:1px solid #d2dbd0;background:rgba(255,255,255,.8)}
    .button-gold{background:var(--gold);color:var(--deep);}
    .button-danger{background:#d9534f;color:#fff}

    .monetize-section {
      padding: 60px 0;
      background: #112821;
      color: #fff;
    }
    .monetize-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .monetize-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 24px;
    }
    .monetize-card h3 { font-size: 18px; color: var(--green); margin-bottom: 8px; }
    .monetize-card p { font-size: 13px; color: #c5d4cc; margin-bottom: 16px; }

    .lottery-section {
      padding: 50px 0;
      background: #eef3ec;
      border-top: 1px solid var(--line);
    }
    .lottery-box {
      background: #fff;
      border: 1px solid #d5e2cd;
      border-radius: 16px;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    .lottery-result {
      margin-top: 15px;
      padding: 12px;
      background: #f0f4eb;
      border-radius: 8px;
      font-weight: 700;
      color: var(--deep);
      display: none;
    }

    .portal-section {
      padding: 50px 0;
      background: #ffffff;
      border-top: 1px solid var(--line);
    }
    .portal-box {
      background: #f4f7f2;
      border: 1px solid #d5e2cd;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
    }
    .lock-screen {
      text-align: center;
      padding: 20px 10px;
    }
    .password-input-group {
      display: inline-flex;
      gap: 10px;
      max-width: 360px;
      width: 100%;
    }
    .password-input-group input, .form-control {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    .portal-content {
      display: none;
      margin-top: 20px;
    }
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .portal-item {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #e3e8df;
    }
    .bank-card {
      background: #fff;
      border-left: 4px solid var(--deep);
      padding: 15px;
      border-radius: 8px;
    }
    .bank-card h4 { font-size: 14px; color: var(--deep); margin-bottom: 5px; }
    .bank-card p { font-size: 12px; color: var(--muted); font-weight: 600; }

    .section{padding:50px 0}
    .two-column{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px}
    .section-title{font-size:clamp(26px,4vw,38px);letter-spacing:-1px;margin:0;line-height:1.2}
    .section-title em,.contact-inner h2 em{font-style:normal;color:#73964e}

    .contact-section{background:var(--deep);color:white;padding:50px 0;text-align:center}
    .contact-socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .contact-social-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
    }

    .footer{background:#102e26;color:#d5e0d8;padding:20px 0;font-size:12px}
    .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

    @media(max-width:1150px){
      .menu-toggle{display:block !important;}
      .nav-links{
        display:none;
        position:absolute;
        top:75px;
        left:0;
        width:100%;
        background:#f7f8f5;
        flex-direction:column;
        align-items:flex-start !important;
        padding:20px;
        gap:14px;
        border-bottom:2px solid var(--line);
        box-shadow:0 15px 25px rgba(0,0,0,0.1);
        z-index:999;
      }
      .nav-links.open{display:flex !important;}
      .password-input-group{flex-direction:column;}
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <header class="site-header">
    <div class="container nav">
      <div class="brand-group">
        <img src="bura.jpg" alt="Barabiruk" class="header-mini-avatar" onerror="this.src='https://via.placeholder.com/36x36/102a43/ffffff?text=B'">
        <a href="#home" class="brand">
          <span class="brand-mark">B</span>
          <span>Bara<span class="brand-accent">biruk</span></span>
        </a>
      </div>

      <!-- NAV LINKS WALIIN DATA-I18N -->
      <nav class="nav-links" id="navLinks">
        <a href="#monetize" style="color:#b38f3e;" data-i18n="navIncome">💎 Galii</a>
        <a href="#portal" data-i18n="navBooks">📚 Kitaabota</a>
        <a href="#portal" data-i18n="navMovies">🎬 Filmiwwan</a>
        <a href="#portal" data-i18n="navMusic">🎵 Faarfannaa</a>
        <a href="#lottery" style="color:#226644;" data-i18n="navLottery">🎯 Carraa (Lottery)</a>
        <a href="#payment" data-i18n="navBank">Baankii & Nagahee</a>
        <a href="#experience" data-i18n="navExperience">Muuxannoo</a>
        <a href="#about" data-i18n="navAbout">About</a>
        <a href="#contact" data-i18n="navContact">Contact</a>
      </nav>
      
      <div class="nav-right">
        <div class="language-picker">
          <select id="langSelect">
            <option value="om">Afaan Oromoo</option>
            <option value="en">English</option>
          </select>
        </div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
      </div>
    </div>
  </header>

</body>
</html>
