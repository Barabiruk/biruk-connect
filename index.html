<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Barabiruk Connect — Personal website, library, monetization, and growth.">
  <meta name="theme-color" content="#f7f8f5">
  <title>Barabiruk Connect | Professional Hub</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root{--ink:#17231f;--muted:#64736c;--paper:#f7f8f5;--green:#c9f36b;--deep:#163d32;--line:#dfe5dc;--white:#fff;--gold:#e6b85c;}
    
    *{box-sizing:border-box; margin:0; padding:0;}
    
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', Arial, sans-serif;
      line-height: 1.65;
    }

    #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;}

    a{color:inherit;text-decoration:none}
    
    .container{
      width: 100%;
      max-width: 1160px;
      padding-left: 16px;
      padding-right: 16px;
      margin-inline: auto;
    }
    
    .site-header{position:sticky;top:0;z-index:1000;background:rgba(247,248,245,.98);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(223,229,220,.8)}
    .nav{height:75px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative}
    
    .brand-group {display:flex; align-items:center; gap:8px;}
    .header-mini-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
    }

    .brand{display:inline-flex;align-items:center;gap:6px;font-family:Manrope,sans-serif;font-size:16px;font-weight:800;letter-spacing:-.7px;white-space:nowrap}
    .brand-mark{display:grid;place-items:center;width:28px;height:28px;background:var(--green);border-radius:8px;font-size:14px}
    .brand-accent{color:#53836a;margin-left:2px}
    
    .nav-right{display:flex;align-items:center;gap:8px;}
    
    .nav-links{display:flex;gap:14px;align-items:center}
    .nav-links a{font-size:12px;color:#53625a;font-weight:700;transition:color .2s;white-space:nowrap;}
    .nav-links a:hover{color:#578c3e}
    
    .language-picker select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff;color:var(--ink);font:600 11px 'DM Sans',sans-serif;cursor:pointer;outline:none}
    .menu-toggle{display:none;background:none;border:0;font-size:22px;color:var(--ink);cursor:pointer;padding:4px}

    .hero{position:relative;overflow:hidden;background:rgba(237,241,233,0.7);padding:30px 0}
    .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
    .hero-copy{padding:10px 0}
    .eyebrow,.section-kicker{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#65816b}
    .eyebrow{display:flex;align-items:center;gap:8px}
    .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:#79aa4a;display:inline-block}
    .hero h1,.section-title,.contact-inner h2{font-family:Manrope,sans-serif;font-size:clamp(28px,5vw,56px);line-height:1.12;letter-spacing:-1.5px;margin:14px 0 14px;font-weight:800}
    .hero h1 span{color:#62834d}
    .hero-text{max-width:510px;color:#637168;font-size:15px;line-height:1.7}
    .hero-actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
    
    .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:700;transition:transform .2s,background .2s;cursor:pointer;border:none;}
    .button-primary{background:var(--deep);color:#fff}
    .button-quiet{border:1px solid #d2dbd0;background:rgba(255,255,255,.8)}
    .button-gold{background:var(--gold);color:var(--deep);}
    .button-danger{background:#d9534f;color:#fff}

    .hero-card-wrap{position:relative;width:100%;max-width:320px;margin:10px auto;perspective:1000px}
    .hero-card{position:relative;z-index:1;padding:18px;border:1px solid rgba(255,255,255,.9);border-radius:19px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:0 15px 35px rgba(34,57,39,.08);text-align:center}
    .card-top{display:flex;align-items:center;gap:8px;text-align:left;color:#718077;font-size:9px;font-weight:700;letter-spacing:1px}
    .card-star{margin-left:auto;font-size:16px;color:#79a84e}

    .portrait-email-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #eef3ec;
      border: 1px solid #d5e2cd;
      color: #3b5a44;
      padding: 5px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .social-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #f0f4eb;
      color: var(--deep);
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.2s, background 0.2s;
      border: 1px solid #dfe5dc;
    }
    .social-btn:hover {
      transform: translateY(-2px);
      background: var(--green);
    }

    .hero-card h2{font:800 18px Manrope,sans-serif;letter-spacing:-.5px;margin:0}
    .profile-role{font-size:12px;color:#7b877f;margin:2px 0 10px}
    .card-divider{height:1px;background:#e6ebe3}
    .card-quote{font:500 12px Manrope,sans-serif;line-height:1.5;color:#4f6055;margin:10px 0}
    
    .floating-label{
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border: 1px solid #e3e8df;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.05);
      font-size: 9px;
      font-weight: 700;
    }
    .label-top{top: -10px; right: 0px;}
    .label-bottom{bottom: -10px; left: 0px;}

    .monetize-section {
      padding: 60px 0;
      background: #112821;
      color: #fff;
    }
    .monetize-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }
    .monetize-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 24px;
      transition: transform 0.2s;
    }
    .monetize-card:hover { transform: translateY(-4px); }
    .monetize-card h3 { font-size: 18px; color: var(--green); margin-bottom: 8px; }
    .monetize-card p { font-size: 13px; color: #c5d4cc; margin-bottom: 16px; }

    .portal-section {
      padding: 50px 0;
      background: #ffffff;
      border-top: 1px solid var(--line);
    }
    .portal-box {
      background: #f4f7f2;
      border: 1px solid #d5e2cd;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 25px;
    }
    .lock-screen {
      text-align: center;
      padding: 20px 10px;
    }
    .password-input-group {
      display: inline-flex;
      gap: 10px;
      max-width: 360px;
      width: 100%;
    }
    .password-input-group input, .form-control {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 100%;
    }
    .portal-content {
      display: none;
      margin-top: 20px;
    }
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .portal-item {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #e3e8df;
    }
    .bank-card {
      background: #fff;
      border-left: 4px solid var(--deep);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .bank-card h4 { font-size: 14px; color: var(--deep); margin-bottom: 5px; }
    .bank-card p { font-size: 12px; color: var(--muted); font-weight: 600; }
