backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
backend:
  name: git-gateway
  branch: main # Yoo branch keessan 'master' ta'e master gochaa

media_folder: "images/uploads" # Bakka suuraawwan/media'n itti kuufaman
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Post-iiwwan (Posts)"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Mata Duree (Title)", name: "title", widget: "string" }
      - { label: "Guyyaa (Publish Date)", name: "date", widget: "datetime" }
      - { label: "Suuraa (Featured Image)", name: "image", widget: "image", required: false }
      - { label: "Barruu/Odeeffannoo (Body)", name: "body", widget: "markdown" }
